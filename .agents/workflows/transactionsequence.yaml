main:
  params: [input]
  steps:
    - init:
        assign:
          - session_data: ${input.SessionData}
          - uid: ${session_data["dataset:authorizationuid"]}
          - session_id: ${session_data["dataset:sessionId"]}
          - transaction_event: ${session_data["dataset:transaction"]}
          - uniquegenericname: ${session_data["dataset:uniquegenericname"]}

    - get_prerequisites:
        call: http.post
        args:
          url: "https://dataset-background-services-315685320181.europe-west1.run.app/service"
          auth:
            type: OIDC
          body:
            uid: ${uid}
            service: "OrderedListOfPrerequisites"
            "prov:activity": ${transaction_event}
            "dataset:uniquegenericname": ${uniquegenericname}
        result: prereq_response

    - extract_prerequisites:
        assign:
          - prerequisite_list: ${prereq_response.body["dataset:simpcatobj"][0]["dataset:requiredtransactionid"]}
          - full_list: ${list.concat(prerequisite_list, [transaction_event])}

    - loop_prerequisites:
        for:
          value: current_event
          in: ${full_list}
          steps:
            - check_prerequisite_exists:
                call: http.post
                args:
                  url: "https://dataset-background-services-315685320181.europe-west1.run.app/service"
                  auth:
                    type: OIDC
                  body:
                    uid: ${uid}
                    service: "FindDatasetTransaction"
                    "prov:activity": ${current_event}
                    "dataset:booleanonlyone": false
                    "dcterms:creator": ${uid}
                    "dataset:activityinfo":
                      "dataset:uniquegenericname": ${uniquegenericname}
                result: find_response

            - run_single_transaction:
                switch:
                  - condition: ${find_response.body["dataset:servicesuccessful"] != "true"}
                    steps:
                      - prep_subworkflow_args:
                          assign:
                            - session_data["dataset:transaction"]: ${current_event}
                            - subworkflow_args:
                                SessionData: ${session_data}
                      - execute_subworkflow:
                          call: googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run
                          args:
                            workflow_id: "single-transaction-workflow"
                            project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                            location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
                            argument: ${subworkflow_args}
                          result: subworkflow_result
                      - parse_subworkflow_output:
                          assign:
                            - run_output: ${subworkflow_result}
                      - log_parse_output:
                          call: sys.log
                          args:
                            text: '${"parse_subworkflow_output completed for event: " + json.encode_to_string(current_event)}'
                            severity: "INFO"
                      - verify_success:
                          switch:
                            - condition: ${run_output.body["dataset:servicesuccessful"] != "true"}
                              steps:
                                - stop_execution:
                                    return: ${run_output}
                      - requery_session_data:
                          call: http.post
                          args:
                            url: "https://dataset-background-services-315685320181.europe-west1.run.app/service"
                            auth:
                              type: OIDC
                            body:
                              uid: ${uid}
                              "<http://purl.org/dc/elements/1.1/identifier>": "dataset:sessiondata"
                              "dataset:authorizationuid": ${uid}
                              service: "ReadSessionDataService"
                              "dataset:sessionId": ${session_id}
                          result: new_session_response
                      - assign_new_session:
                          assign:
                            - session_data: ${new_session_response.body["dataset:simpcatobj"][0]}

    - mark_sequence_complete:
        assign:
          - session_data["dataset:sessionstatus"]: "Complete"
          - session_data["dataset:sessionworkflowreturnlink"]: ""

    - write_complete_session:
        call: http.post
        args:
          url: "https://dataset-background-services-315685320181.europe-west1.run.app/service"
          auth:
            type: OIDC
          body:
            uid: ${uid}
            service: "UpdateSessionDataService"
            "dataset:sessiondata": ${session_data}

    - return_final_success:
        return:
          "dataset:servicesuccessful": "true"
          "dataset:serviceresponsemessage": "All transactions in sequence executed successfully."
          "dataset:simpcatobj":
            - ${session_data}
