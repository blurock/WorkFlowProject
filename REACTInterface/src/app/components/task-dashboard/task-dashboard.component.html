<div class="dashboard-container">
  <!-- Top Navigation Header -->
  <mat-toolbar color="primary" class="dashboard-toolbar">
    <div class="brand">
      <mat-icon class="brand-icon">science</mat-icon>
      <span class="brand-title">REACTInterface</span>
      <span class="brand-badge">Dashboard</span>
    </div>

    <span class="toolbar-spacer"></span>

    <div class="user-profile" *ngIf="authService.currentUser() as user">
      <mat-icon class="user-avatar">account_circle</mat-icon>
      <span class="user-name">{{ user.username }}</span>
    </div>

    <button mat-icon-button (click)="onLogout()" title="Sign Out">
      <mat-icon>exit_to_app</mat-icon>
    </button>
  </mat-toolbar>

  <!-- Main Content Sidenav Layout -->
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav mode="side" opened class="dashboard-sidenav">
      <div class="sidenav-header">
        <h3>Catalog Tasks</h3>
        <p>Select a task to run the REACTCLOUD API</p>
      </div>

      <mat-nav-list class="task-nav-list">
        <a
          mat-list-item
          *ngFor="let task of tasks"
          (click)="selectTask(task)"
          [class.active-task]="selectedTask.id === task.id"
          class="task-nav-item">
          <mat-icon matListItemIcon color="primary">{{ task.icon }}</mat-icon>
          <div matListItemTitle class="task-nav-title">{{ task.title }}</div>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="dashboard-main-content">
      <div class="content-wrapper">
        <app-task-list-view [task]="selectedTask"></app-task-list-view>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
