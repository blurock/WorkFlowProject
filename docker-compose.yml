version: '3.8'

services:
  orchestrator:
    build:
      context: ./REACTCLOUD
      dockerfile: Dockerfile
    container_name: react-orchestrator
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - REACTROOT=/opt/react
      - CCROOT=/opt/react
      - GCS_BUCKET=blurock-database.appspot.com
    volumes:
      - ./REACTCLOUD/data:/opt/react/data
    restart: unless-stopped

  frontend:
    build:
      context: ./REACTInterface
      dockerfile: Dockerfile
    container_name: react-interface
    ports:
      - "4200:80"
    depends_on:
      - orchestrator
    restart: unless-stopped

networks:
  default:
    name: react-stack-network
