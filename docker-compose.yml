# ==============================================================================
# Local Docker Compose for Testing the Unified REACT Cloud Run Container
# ==============================================================================
# Runs the exact same all-in-one container deployed to Google Cloud Run:
#   - REACTInterface Frontend:  http://localhost:8080/
#   - REACTCLOUD API:           http://localhost:8080/api/health
#   - Ketcher Standalone:       http://localhost:8080/ketcher/
# ==============================================================================

services:
  reactcloud:
    build:
      context: .
      dockerfile: REACTCLOUD/Dockerfile
    container_name: react-complete-stack
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REACTROOT=/opt/react
      - CCROOT=/opt/react
      - GCP_PROJECT=blurock-database
      - GCS_BUCKET=blurock-database.appspot.com
    restart: unless-stopped
