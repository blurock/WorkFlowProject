<div class="metadata-container">
  <!-- 1. Collapsed State -->
  <div class="one-line-summary-row" *ngIf="!expanded">
    <div class="one-line-summary-text">
      <mat-icon color="primary">storage</mat-icon>
      <span class="one-line-summary-badge badge-blue">Database Metadata</span>
      <span class="one-line-summary-title">Database Object Summary:</span>
      <span class="one-line-summary-title" *ngIf="shortDescription && shortDescription !== 'not assigned'"> - {{
        shortDescription }}</span>
      <span class="one-line-summary-placeholder" *ngIf="!shortDescription || shortDescription === 'not assigned'"> - not
        assigned</span>
    </div>
    <button mat-icon-button (click)="toggleExpand($event)" matTooltip="View details" type="button">
      <mat-icon>visibility</mat-icon>
    </button>
  </div>

  <!-- 2. Expanded State -->
  <div class="one-line-summary-card" *ngIf="expanded">
    <div class="one-line-summary-card-header">
      <div class="one-line-summary-card-title">
        <mat-icon color="primary">storage</mat-icon>
        <span>Database Object Details</span>
      </div>
      <button mat-icon-button (click)="toggleExpand($event)" matTooltip="Collapse details" type="button">
        <mat-icon>visibility_off</mat-icon>
      </button>
    </div>

    <mat-divider style="margin-bottom: 12px;"></mat-divider>

    <div *ngIf="loading" class="mdo-loading">
      Loading structure metadata...
    </div>

    <div *ngIf="!loading && structure" class="mdo-properties readonly-fields metadata-section">
      <!-- 5. MinimumDatabaseObject component -->
      <div class="mdo-property-row full-width-prop"
        style="background: none; border: none; padding: 0; display: flex; flex-direction: column; gap: 8px;">

        <!-- Short Description -->
        <div *ngIf="hasProperty('dataset:shortdescription')" class="mdo-property-row full-width-prop">

          <div class="mdo-prop-value">
            <app-dynamic-primitive [structure]="getPropertyStructure('dataset:shortdescription')"
              [value]="value ? value['dataset:shortdescription'] : null"
              (valueChange)="updateProperty('dataset:shortdescription', $event)">
            </app-dynamic-primitive>
          </div>
        </div>

        <!-- IDs Row -->
        <div
          style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; width: 100%;">
          <!-- Catalog Object ID -->
          <div *ngIf="hasProperty('dataset:catobjid')" class="mdo-property-row">

            <div class="mdo-prop-value">
              <app-dynamic-primitive [structure]="getPropertyStructure('dataset:catobjid')"
                [value]="value ? value['dataset:catobjid'] : null"
                (valueChange)="updateProperty('dataset:catobjid', $event)">
              </app-dynamic-primitive>
            </div>
          </div>

          <!-- Transaction ID -->
          <div *ngIf="hasProperty('dataset:transactionid')" class="mdo-property-row">

            <div class="mdo-prop-value">
              <app-dynamic-primitive [structure]="getPropertyStructure('dataset:transactionid')"
                [value]="value ? value['dataset:transactionid'] : null"
                (valueChange)="updateProperty('dataset:transactionid', $event)">
              </app-dynamic-primitive>
            </div>
          </div>
        </div>

        <!-- Render the SimpleCatalogObject component at the bottom -->
        <div *ngIf="value" style="margin-top: 8px; width: 100%;">
          <app-simple-catalog-object [value]="value" (valueChange)="updateValue($event)"></app-simple-catalog-object>
        </div>
      </div>
    </div>
  </div>
</div>
