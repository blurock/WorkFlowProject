<div class="workflow-container">
  <div *ngIf="loading" class="loading-overlay">
    <h2>Loading Task Data...</h2>
  </div>

  <div *ngIf="errorMessage" class="error-banner">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && sessionData && activityData" class="task-content">
    <header>
      <h1>Pending Workflow Task</h1>
      <p>Session ID: {{ sessionData[ontology.SessionId] }}</p>
    </header>

    <div class="upload-section">
      <p><strong>Quick Fill:</strong> Upload a JSON file to automatically fill in the form fields below.</p>
      <div class="file-upload-wrapper">
        <label for="jsonUpload" class="btn btn-secondary">
          Browse JSON File
        </label>
        <input id="jsonUpload" type="file" (change)="onFileSelected($event)" accept=".json" hidden>
      </div>
    </div>

    <div class="activity-form-container">
      <ng-container [ngSwitch]="activityData[ontology.CatalogObjectType]">

        <!-- Generic Fallback or specific mappings -->
        <ng-container *ngSwitchDefault>
          <div *ngIf="activityTemplateStruct">
            <h3>Please complete the following information:</h3>
            <app-dynamic-primitive [structure]="activityTemplateStruct" [(value)]="activityData">
            </app-dynamic-primitive>
          </div>
        </ng-container>

      </ng-container>
    </div>

    <div class="actions">
      <button class="btn btn-primary" (click)="submitTask()">Submit & Continue Workflow</button>
    </div>
  </div>
</div>
